name: GigaLoom quality

on:
  push:
    branches: [main]
    paths:
      - "packages/gpt2giga-harness/**"
      - "tests/**"
      - "benchmarks/gigaloom_performance/**"
      - "scripts/ci-*.sh"
      - "pyproject.toml"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/gpt2giga-harness/**"
      - "tests/**"
      - "benchmarks/gigaloom_performance/**"
      - "scripts/ci-*.sh"
      - "pyproject.toml"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gigaloom-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  GIGALOOM_UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv

jobs:
  frontend:
    name: Frontend / static and browser
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: packages/gpt2giga-harness/frontend/package-lock.json

      - name: Install pinned npm 11.17
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Install pinned frontend dependencies
        run: npm --prefix packages/gpt2giga-harness/frontend ci --ignore-scripts

      - name: Run typecheck, lint, unit, and determinism gates
        run: npm --prefix packages/gpt2giga-harness/frontend run check

      - name: Produce clean commit-bound assets
        run: npm --prefix packages/gpt2giga-harness/frontend run build:release

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/gpt2giga-harness/pyproject.toml

      - name: Install standalone browser-QA runtime
        env:
          GIGALOOM_PYTHON: "3.13"
        run: ./scripts/ci-base.sh sync

      - name: Install Chromium
        run: npm --prefix packages/gpt2giga-harness/frontend exec -- playwright install --with-deps chromium

      - name: Run desktop and 390x844 browser QA
        env:
          CI: "true"
        run: npm --prefix packages/gpt2giga-harness/frontend run test:e2e

      - name: Verify asset provenance, SBOM, and licenses
        run: .venv/bin/python packages/gpt2giga-harness/asset_contract.py --require-clean

      - name: Upload commit-bound assets
        uses: actions/upload-artifact@v7
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: packages/gpt2giga-harness/src/gpt2giga_harness/ui/cockpit_v2/assets
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gigaloom-browser-qa-${{ github.sha }}
          path: test-results/browser-qa
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified frontend assets
        uses: actions/download-artifact@v7
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: packages/gpt2giga-harness/src/gpt2giga_harness/ui/cockpit_v2/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/gpt2giga-harness/pyproject.toml

      - name: Install standalone test environment
        env:
          GIGALOOM_PYTHON: ${{ matrix.python-version }}
        run: ./scripts/ci-base.sh sync

      - name: Run Ruff
        if: matrix.python-version == '3.13'
        run: |
          ./scripts/ci-base.sh ruff-check .
          ./scripts/ci-base.sh ruff-format-check .

      - name: Run Harness tests
        run: >-
          ./scripts/ci-base.sh pytest tests/harness -n 4
          --cov=. --cov-report=json:coverage.json --cov-fail-under=80

      - name: Upload coverage evidence
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: gigaloom-coverage-3.13
          path: coverage.json
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package / base artifact
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified frontend assets
        uses: actions/download-artifact@v7
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: packages/gpt2giga-harness/src/gpt2giga_harness/ui/cockpit_v2/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/gpt2giga-harness/pyproject.toml

      - name: Install artifact-test environment
        env:
          GIGALOOM_PYTHON: "3.13"
        run: ./scripts/ci-base.sh sync

      - name: Build standalone wheel and sdist
        run: uv build --package gpt2giga-harness --wheel --sdist --no-sources --out-dir dist/gigaloom

      - name: Verify base isolation and installed artifact evidence
        run: >-
          ./scripts/ci-base.sh pytest
          tests/test_gigaloom_artifact_isolation.py
          tests/test_gigaloom_quality_workflows.py
          tests/harness/test_ui_packaging.py
          -q -n 0

      - name: Upload standalone distribution
        uses: actions/upload-artifact@v7
        with:
          name: gpt2giga-harness-${{ github.sha }}
          path: dist/gigaloom/*
          if-no-files-found: error
          retention-days: 7

  terminal:
    name: Terminal / ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13", "3.14"]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified frontend assets
        uses: actions/download-artifact@v7
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: packages/gpt2giga-harness/src/gpt2giga_harness/ui/cockpit_v2/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/gpt2giga-harness/pyproject.toml

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Build and install standard wheel
        run: |
          uv build --package gpt2giga-harness --wheel --no-sources --out-dir dist/terminal
          uv venv --python ${{ matrix.python-version }} .venv-terminal
          uv pip install --python .venv-terminal dist/terminal/gpt2giga_harness-*.whl

      - name: Smoke terminal dispatch and CLI
        run: |
          uv run --python .venv-terminal --no-project python -I -c "import importlib.metadata as m; assert any(r.casefold().startswith('textual') for r in m.requires('gpt2giga-harness')); assert all(x != 'tui' for x in (m.metadata('gpt2giga-harness').get_all('Provides-Extra') or ()))"
          uv run --python .venv-terminal --no-project python -I -c "from gpt2giga_harness.terminal_dispatch import TerminalContext, plan_terminal_dispatch; from gpt2giga_harness.terminal_intent import parse_tui_launch_intent; p=plan_terminal_dispatch(('run','--agent','codex','inspect'), context=TerminalContext(True,True,True,'xterm-256color')); i,_=parse_tui_launch_intent(('run','--agent','codex','inspect')); assert p.initialize_textual and i.harness_id == 'codex-cli' and i.prompt == 'inspect'"
          uv run --python .venv-terminal --no-project giga --help
          uv run --python .venv-terminal --no-project giga --version
          uv run --python .venv-terminal --no-project giga --non-interactive --help

      - name: Smoke reinstall, rollback, and uninstall mechanics
        run: |
          uv pip install --python .venv-terminal --reinstall dist/terminal/gpt2giga_harness-*.whl
          uv pip uninstall --python .venv-terminal gpt2giga-harness
          uv pip install --python .venv-terminal dist/terminal/gpt2giga_harness-*.whl
          uv run --python .venv-terminal --no-project giga --version
          uv pip uninstall --python .venv-terminal gpt2giga-harness
          uv run --python .venv-terminal --no-project python -I -c "import importlib.util; assert importlib.util.find_spec('gpt2giga_harness') is None"

  performance:
    name: Performance / ci-smoke
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified frontend assets
        uses: actions/download-artifact@v7
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: packages/gpt2giga-harness/src/gpt2giga_harness/ui/cockpit_v2/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/gpt2giga-harness/pyproject.toml

      - name: Install standalone performance environment
        env:
          GIGALOOM_PYTHON: "3.13"
        run: ./scripts/ci-base.sh sync

      - name: Run deterministic performance budgets
        run: .venv/bin/giga benchmark performance --profile ci-smoke --samples 5 --output performance-artifacts/ci-smoke.json

      - name: Upload bounded performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gigaloom-performance-ci-smoke
          path: performance-artifacts/ci-smoke.json
          if-no-files-found: error
          retention-days: 7

  registry-readiness:
    name: Public registry / blocked_pending_S5_03B
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Assert fail-closed public-registry readiness
        shell: bash
        run: |
          set -euo pipefail
          test ! -e uv.lock
          test ! -e .github/workflows/publish-pypi.yml
          test -x scripts/ci-candidate-gateway.sh
          echo "status=blocked_pending_S5_03B"
          echo "The exact checksum-bound candidate smoke is manual until S5-03B."
