name: Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'src/gpt2giga/**'
      - '!src/gpt2giga/**/*.md'
      - 'README.md'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/gpt2giga/**'
      - '!src/gpt2giga/**/*.md'
      - 'README.md'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gateway tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install gateway dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        if: matrix.python-version == '3.13'
        run: uv run ruff check .

      - name: Check formatting with Ruff
        if: matrix.python-version == '3.13'
        run: uv run ruff format --check .

      - name: Run gateway tests with coverage
        run: >-
          uv run pytest tests/ -n 4
          --cov=. --cov-report=json:coverage.json --cov-fail-under=80

      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: gateway-coverage-3.13
          path: coverage.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Gateway package / wheel and sdist
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Resolve gateway version
        id: version
        run: echo "value=$(uv version --short --frozen)" >> "$GITHUB_OUTPUT"

      - name: Build gateway wheel and sdist
        run: uv build --wheel --sdist --no-sources --out-dir dist/gpt2giga

      - name: Upload gateway artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gpt2giga-${{ steps.version.outputs.value }}
          path: dist/gpt2giga/*
          if-no-files-found: error
          retention-days: 7

  minimum-sdk:
    name: Gateway minimum SDK / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Resolve gateway version
        id: version
        run: echo "value=$(uv version --short --frozen)" >> "$GITHUB_OUTPUT"

      - name: Build gateway wheel
        run: uv build --wheel --no-sources --out-dir dist/min-sdk

      - name: Create clean minimum SDK environment
        run: uv venv --python ${{ matrix.python-version }} .venv-min-sdk

      - name: Install minimum stable SDK and gateway wheel
        run: |
          uv pip install --python .venv-min-sdk/bin/python "gigachat==0.2.3"
          uv pip install --python .venv-min-sdk/bin/python dist/min-sdk/gpt2giga-*.whl

      - name: Run minimum-SDK installed contract smoke
        env:
          GATEWAY_VERSION: ${{ steps.version.outputs.value }}
        run: |
          .venv-min-sdk/bin/python -I - <<'PY'
          import importlib.metadata
          import importlib.util
          import os
          from pathlib import Path

          from fastapi.testclient import TestClient

          import gpt2giga
          from gpt2giga.app.factory import create_app
          from gpt2giga.models.config import ProxyConfig

          assert importlib.metadata.version("gpt2giga") == os.environ["GATEWAY_VERSION"]
          assert importlib.metadata.version("gigachat") == "0.2.3"
          assert not Path(gpt2giga.__file__).resolve().is_relative_to(
              Path.cwd() / "src"
          )
          assert importlib.util.find_spec("gpt2giga_harness") is None

          client = TestClient(create_app(ProxyConfig()))
          assert client.get("/health").status_code == 200
          openapi = client.get("/openapi.json")
          assert openapi.status_code == 200
          paths = openapi.json()["paths"]
          assert "/v1/chat/completions" in paths
          assert "/v1/messages" in paths
          assert "/v1beta/models/{model}:generateContent" in paths
          PY
          .venv-min-sdk/bin/gpt2giga --help

  artifact-smoke:
    name: Gateway artifact / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Resolve gateway version
        id: version
        run: echo "value=$(uv version --short --frozen)" >> "$GITHUB_OUTPUT"

      - name: Build gateway wheel
        run: uv build --wheel --no-sources --out-dir dist/smoke

      - name: Create clean artifact environment
        run: uv venv --python ${{ matrix.python-version }} .venv-artifact

      - name: Install gateway artifact
        run: uv pip install --python .venv-artifact/bin/python dist/smoke/gpt2giga-*.whl

      - name: Smoke installed gateway artifact
        env:
          GATEWAY_VERSION: ${{ steps.version.outputs.value }}
        run: |
          .venv-artifact/bin/python -I -c "import importlib.metadata as m, os, gpt2giga; assert m.version('gpt2giga') == os.environ['GATEWAY_VERSION']"
          .venv-artifact/bin/gpt2giga --help

  coverage-badge:
    name: Gateway coverage / badge
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download gateway coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: gateway-coverage-3.13
          path: .

      - name: Generate badge
        run: |
          COVERAGE=$(jq '.totals.percent_covered' coverage.json)
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          python3 scripts/generate_badge.py "$COVERAGE" badges/coverage.svg

      - name: Upload badge artifact
        uses: actions/upload-artifact@v7
        with:
          name: gateway-coverage-badge
          path: badges/coverage.svg

      - name: Commit coverage badge on main
        if: github.event_name == 'push'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git commit -m "Update coverage badge for ${BRANCH_NAME}" || echo "No changes to commit"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Comment coverage badge on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: coverage-badge
          message: |
            ## Gateway test coverage
            Coverage: ${{ env.COVERAGE }}%

            ![Coverage Badge](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/badges/coverage.svg)
