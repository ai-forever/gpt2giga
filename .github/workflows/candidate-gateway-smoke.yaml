name: Optional gateway candidate smoke

on:
  workflow_dispatch:
    inputs:
      candidate-wheel-url:
        description: HTTPS URL for the approved gpt2giga 0.2.6a1 candidate wheel
        required: true
        type: string
      candidate-wheel-sha256:
        description: Approved lowercase SHA-256 digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Optional integration / checksum-bound candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: packages/gpt2giga-harness/frontend/package-lock.json

      - name: Install pinned npm 11.17
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Produce clean frontend assets
        run: |
          npm --prefix packages/gpt2giga-harness/frontend ci --ignore-scripts
          npm --prefix packages/gpt2giga-harness/frontend run build:release

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/gpt2giga-harness/pyproject.toml

      - name: Download explicit candidate input
        env:
          CANDIDATE_URL: ${{ inputs.candidate-wheel-url }}
        run: >-
          curl --proto '=https' --tlsv1.2
          --fail --show-error --silent --location
          --output "${RUNNER_TEMP}/gpt2giga-0.2.6a1-py3-none-any.whl"
          "${CANDIDATE_URL}"

      - name: Verify digest before install and run optional preset smoke
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate-wheel-sha256 }}
        run: |
          ./scripts/ci-candidate-gateway.sh \
            "${RUNNER_TEMP}/gpt2giga-0.2.6a1-py3-none-any.whl" \
            "${CANDIDATE_SHA256}"

      - name: Assert candidate state was not persisted
        run: |
          test ! -e uv.lock
          test -z "$(git status --short)"
