name: CodeQL

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/gpt2giga-harness/**/*.py'
      - 'packages/gpt2giga-harness/frontend/**/*.{js,jsx,ts,tsx}'
      - 'packages/gpt2giga-harness/pyproject.toml'
      - 'packages/gpt2giga-harness/frontend/package.json'
      - 'packages/gpt2giga-harness/frontend/package-lock.json'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/codeql.yaml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/gpt2giga-harness/**/*.py'
      - 'packages/gpt2giga-harness/frontend/**/*.{js,jsx,ts,tsx}'
      - 'packages/gpt2giga-harness/pyproject.toml'
      - 'packages/gpt2giga-harness/frontend/package.json'
      - 'packages/gpt2giga-harness/frontend/package-lock.json'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/codeql.yaml'
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze / ${{ matrix.language }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    strategy:
      fail-fast: false
      matrix:
        language: [ python, javascript-typescript ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
