name: Publish gateway package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Gateway release / tag and version guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.guard.outputs.mode }}
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify gateway tag and version
        id: guard
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python3 scripts/gateway_release_guard.py
          --event-name "${GITHUB_EVENT_NAME}"
          --ref-name "${GITHUB_REF_NAME}"
          --release-tag "${RELEASE_TAG}"
          --github-output "${GITHUB_OUTPUT}"

  build:
    name: Gateway release / build and attest
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build gateway wheel and sdist
        run: uv build --wheel --sdist --no-sources --out-dir dist/gpt2giga

      - name: Guard gateway artifacts and write checksums
        env:
          GATEWAY_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test "$(find dist/gpt2giga -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" = "2"
          test "$(find dist/gpt2giga -maxdepth 1 -type f -name "gpt2giga-${GATEWAY_VERSION}-*.whl" | wc -l | tr -d ' ')" = "1"
          test "$(find dist/gpt2giga -maxdepth 1 -type f -name "gpt2giga-${GATEWAY_VERSION}.tar.gz" | wc -l | tr -d ' ')" = "1"
          sha256sum dist/gpt2giga/* > dist/gpt2giga-SHA256SUMS
          cat dist/gpt2giga-SHA256SUMS

      - name: Attest gateway artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/gpt2giga/*

      - name: Upload gateway release evidence
        uses: actions/upload-artifact@v7
        with:
          name: gateway-release-${{ needs.metadata.outputs.version }}
          path: |
            dist/gpt2giga/*
            dist/gpt2giga-SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Gateway release / protected PyPI upload
    needs: [metadata, build]
    if: needs.metadata.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: pypi-gateway

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Download attested gateway artifacts
        uses: actions/download-artifact@v7
        with:
          name: gateway-release-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Publish gateway to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_KEY }}
        run: >-
          uv publish --token "${PYPI_TOKEN}"
          dist/gpt2giga/*.whl
          dist/gpt2giga/*.tar.gz
