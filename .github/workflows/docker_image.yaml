name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'Dockerfile'
      - 'src/gpt2giga/**'
      - '!src/gpt2giga/**/*.md'
      - 'README.md'
      - 'pyproject.toml'
      - '.github/workflows/docker_image.yaml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: gigateam/gpt2giga

permissions:
  contents: read

jobs:
  build-and-push:
    name: Gateway Docker Hub / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - python-version: '3.15'
            python-image: '3.15-rc'
            preview: true

    steps:
    - uses: actions/checkout@v7

    - name: Get version
      id: get_version
      shell: bash
      run: |
        VERSION="$(python3 - <<'PY'
        import tomllib
        from pathlib import Path

        pyproject = tomllib.loads(
            Path("pyproject.toml").read_text(encoding="utf-8")
        )
        print(pyproject["project"]["version"])
        PY
        )"

        if [ -z "$VERSION" ]; then
          echo "::error::Unable to determine project version from pyproject.toml"
          exit 1
        fi

        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Log in to Docker Hub
      uses: docker/login-action@v4.7.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_LOGIN }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Prepare Docker tags
      id: docker_tags
      shell: bash
      run: |
        PYTHON_VERSION="${{ matrix.python-version }}"
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        SUFFIX="python${PYTHON_VERSION}"
        if [ "${{ matrix.preview }}" = "true" ]; then
          SUFFIX="${SUFFIX}-preview"
        fi

        {
          echo "tags<<EOF"
          echo "${IMAGE_NAME}:${SUFFIX}"
          echo "${IMAGE_NAME}:${SUFFIX}-${GITHUB_SHA}"
          echo "${IMAGE_NAME}:${VERSION}-${SUFFIX}"
          if [ "${{ matrix.preview }}" = "true" ]; then
            echo "${IMAGE_NAME}:preview"
            echo "${IMAGE_NAME}:${VERSION}-preview"
          fi
          if [ "${PYTHON_VERSION}" = "3.13" ]; then
            echo "${IMAGE_NAME}:${VERSION}"
            echo "${IMAGE_NAME}:latest"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        build-args: |
          PYTHON_VERSION=${{ matrix.python-image || matrix.python-version }}
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.docker_tags.outputs.tags }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
