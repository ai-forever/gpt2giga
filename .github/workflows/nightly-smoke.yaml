name: Gateway nightly smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Gateway API / nightly smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/gpt2giga/pyproject.toml
            uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install gateway dependencies
        run: uv sync --package gpt2giga --all-extras --dev

      - name: Run gateway API smoke tests
        run: uv run pytest tests/test_api_server/test_ci_smoke.py -q -n 0
