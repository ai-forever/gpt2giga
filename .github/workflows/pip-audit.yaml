name: Python dependency audit

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: packages/gpt2giga-harness/frontend/package-lock.json

      - name: Produce frontend assets
        run: |
          npm install --global --ignore-scripts npm@11.17.0
          npm --prefix packages/gpt2giga-harness/frontend ci --ignore-scripts
          npm --prefix packages/gpt2giga-harness/frontend run build:release

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/gpt2giga-harness/pyproject.toml

      - name: Install standalone audit environment
        env:
          GIGALOOM_PYTHON: "3.13"
        run: ./scripts/ci-base.sh sync

      - name: Seed pip for the audit action
        run: uv pip install --python .venv/bin/python pip

      - name: Audit dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          local: true
          virtual-environment: .venv
