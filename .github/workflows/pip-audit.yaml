name: Gateway Python dependency audit

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Gateway security / pip audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/gpt2giga/pyproject.toml
            uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install gateway dependencies
        run: uv sync --package gpt2giga --all-extras --dev

      - name: Seed pip for the audit action
        run: uv pip install --python .venv/bin/python pip

      - name: Audit dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          local: true
          virtual-environment: .venv
