template: |
  ## What's Changed

  $CHANGES

categories:
  - title: Agent and provider integrations
    labels:
      - backend
  - title: Cockpit and frontend
    labels:
      - frontend
  - title: Terminal and TUI
    labels:
      - terminal
  - title: Performance
    labels:
      - performance
  - title: Packaging and releases
    labels:
      - packaging
      - release
  - title: Security and governance
    labels:
      - security
      - governance
  - title: CI and automation
    labels:
      - ci
  - title: Tests
    labels:
      - tests
  - title: Dependency updates
    labels:
      - dependencies
  - title: Documentation
    labels:
      - docs

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
no-changes-template: "- No categorized changes yet."
exclude-labels:
  - skip-changelog
