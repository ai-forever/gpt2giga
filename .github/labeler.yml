backend:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/gpt2giga-harness/src/**/*.py"

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/gpt2giga-harness/frontend/**"
          - "packages/gpt2giga-harness/branding/**"

terminal:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/gpt2giga-harness/src/gpt2giga_harness/terminal_*.py"
          - "packages/gpt2giga-harness/src/gpt2giga_harness/tui*.py"
          - "packages/gpt2giga-harness/src/gpt2giga_harness/native/**"
          - "tests/harness/test_terminal_*.py"
          - "tests/harness/test_tui*.py"
          - "tests/harness/test_native_*.py"

performance:
  - changed-files:
      - any-glob-to-any-file:
          - "benchmarks/gigaloom_performance/**"
          - "packages/gpt2giga-harness/src/gpt2giga_harness/*performance*.py"
          - "tests/harness/test_*performance*.py"

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "packages/gpt2giga-harness/pyproject.toml"
          - "packages/gpt2giga-harness/hatch_build.py"
          - "packages/gpt2giga-harness/asset_contract.py"
          - "tests/test_gigaloom_artifact_isolation.py"
          - "tests/test_cross_repository_artifact_smoke.py"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"
          - ".github/release-drafter.yml"
          - ".github/AGENTS.md"
          - "scripts/ci-*.sh"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "docs/**"
          - "docs-site/**"
          - "examples/**/*.md"
          - ".github/PULL_REQUEST_TEMPLATE.md"
          - ".github/ISSUE_TEMPLATE/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "packages/gpt2giga-harness/pyproject.toml"
          - "packages/gpt2giga-harness/frontend/package.json"
          - "packages/gpt2giga-harness/frontend/package-lock.json"
