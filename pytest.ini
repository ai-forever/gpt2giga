[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Local runs use all available CPUs. GitHub Actions overrides this with -n 4.
# Everything under tests/live remains explicit opt-in via -m.
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --asyncio-mode=auto
    -n auto
    -m "not live"
markers =
    unit: Unit tests
    integration: Integration tests
    live: Opt-in tests collected from tests/live
    live_gigachat: Opt-in tests that call the real GigaChat upstream API
    live_native_cli: Opt-in tests that launch a real native agent CLI
    slow: Slow running tests
