[project]
name = "gpt2giga"
version = "0.2.7"
description = "Утилита для проксирования OpenAI, Anthropic и Gemini запросов в GigaChat"
authors = [{ name = "Konstantin Krestnikov", email = "rai220@gmail.com" }]
requires-python = ">=3.10,<4,<3.15"
readme = "README.md"
license = "MIT"
dependencies = [
    "python-dotenv>=1.2.2,<2",
    "aiohttp>=3.14.3,<4",
    "httpx>=0.28.1,<1",
    "tiktoken>=0.13.0,<1",
    "pillow>=12.3.0,<13",
    "uvicorn>=0.51.0,<1",
    "openai>=2.50.0,<3",
    "aioitertools>=0.13.0,<0.14",
    "loguru>=0.7.3,<0.8",
    "sse-starlette>=3.4.6,<4",
    "pydantic-settings>=2.14.2,<3",
    "fastapi>=0.140.13,<1",
    "starlette>=1.3.1,<2",
    "gigachat>=0.2.3,<0.3.0",
    "anthropic>=0.120.2",
    "google-genai>=2.14.0,<3",
]

[project.urls]
Homepage = "https://ai-forever.github.io/gpt2giga/"
Documentation = "https://ai-forever.github.io/gpt2giga/"
Repository = "https://github.com/ai-forever/gpt2giga"
Issues = "https://github.com/ai-forever/gpt2giga/issues"
Changelog = "https://github.com/ai-forever/gpt2giga/blob/main/CHANGELOG_en.md"

[project.scripts]
gpt2giga = "gpt2giga:run"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.31.0,<1",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "alembic>=1.18.5,<2",
]
opensearch = [
    "opensearch-py>=2.8.0,<3",
]
phoenix = [
    "arize-phoenix-otel>=0.1,<1",
    "opentelemetry-sdk>=1.28.0,<2",
    "opentelemetry-exporter-otlp>=1.28.0,<2",
    "openinference-semantic-conventions>=0.1.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt2giga"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "CHANGELOG.md",
    "CHANGELOG_en.md",
]

[tool.coverage.run]
omit = [
  "tests/*",
  "scripts/*",
  "docs/*",
  "*/migrations/*",
  "examples/*",
  "*/__pycache__/*",
  ".local/"
]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "pytest (>=9.0.3, <10.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "ruff (>=0.15,<1)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
]
integrations = [
    "openai-agents (>=0.17,<1)",
    "pyjwt (>=2.12.0)",
    "python-multipart (>=0.0.27, <0.1.0)"

]
