id: issue-to-reviewed-patch
title: Issue to Reviewed Patch
description: Plan, implement in isolation, and review a retained patch before explicit apply.
schema_version: 1
version: 1.0.0
inputs:
  prompt: Read ISSUE.md and produce a reviewed patch for the documented bug.
provenance:
  example: issue-to-reviewed-patch
  stage: pre_apply
budgets:
  max_concurrency: 1
  max_steps: 4
  timeout_seconds: 1800
steps:
  - id: plan
    kind: agent
    title: Plan the issue
    agent_id: issue-planner
    prompt: "Plan this issue without writing: ${prompt}"
    artifact_types: [plan]
  - id: implement
    kind: agent
    title: Implement and test in isolation
    agent_id: patch-implementer
    depends_on: [plan]
    prompt: "Implement this issue in the isolated worktree: ${prompt}"
    artifact_types: [plan]
  - id: review
    kind: agent
    title: Review the retained patch
    agent_id: patch-reviewer
    depends_on: [implement]
    prompt: "Review the isolated patch and test evidence for: ${prompt}"
    artifact_types: [patch, diff, test_report, pr_draft]
  - id: evidence
    kind: join
    title: Retain plan, patch, tests, and review lineage
    depends_on: [plan, implement, review]
