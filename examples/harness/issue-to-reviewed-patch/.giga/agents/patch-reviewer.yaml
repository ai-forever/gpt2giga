id: patch-reviewer
title: Patch Reviewer
description: Reviews the retained diff and test evidence without writing.
schema_version: 1
harness_id: codex-cli
instructions: >-
  Review only the bounded dependency handoff from the isolated implementation.
  Check that the diff matches ISSUE.md, stays minimal, and includes credible
  focused-test evidence. Return an explicit approve or request-changes verdict
  with reasons. Do not edit files, apply the patch, commit, push, or make
  hosted writes.
api_mode: v2
invocation_mode: headless
mode: read
workspace_policy: current
permission_profile: interactive
tool_ids: []
allowed_tools: []
disallowed_tools: []
budgets:
  timeout_seconds: 300
  max_attempts: 1
  max_concurrency: 1
expected_artifact: review_findings
provenance:
  example: issue-to-reviewed-patch
  role: reviewer
