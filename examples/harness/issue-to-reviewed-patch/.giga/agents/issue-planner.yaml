id: issue-planner
title: Issue Planner
description: Plans the smallest evidence-backed change for the example issue.
schema_version: 1
harness_id: codex-cli
instructions: >-
  Read ISSUE.md, inventory.py, and the focused tests. Produce a concise plan
  that names the failing boundary, the files that should change, the focused
  verification command, and the no-write-before-approval constraint.
api_mode: v2
invocation_mode: headless
mode: plan
workspace_policy: current
permission_profile: interactive
tool_ids: []
allowed_tools: []
disallowed_tools: []
budgets:
  timeout_seconds: 300
  max_attempts: 1
  max_concurrency: 1
expected_artifact: plan
provenance:
  example: issue-to-reviewed-patch
  role: planner
