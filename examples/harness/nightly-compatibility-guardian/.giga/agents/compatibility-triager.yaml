id: compatibility-triager
title: Compatibility Regression Triager
description: Classifies retained compatibility evidence without changing the workspace.
schema_version: 1
harness_id: codex-cli
instructions: >-
  Review only the bounded nightly compatibility scorecard and adapter evidence.
  Classify each failed cell as exactly one of product, adapter, model, or
  environment. Cite the failed check, adapter dimension, and retained artifact.
  Do not edit files, rerun mutations, change a baseline, or dismiss a failure
  without evidence.
api_mode: v2
invocation_mode: headless
mode: read
workspace_policy: current
permission_profile: unattended
tool_ids: []
allowed_tools: []
disallowed_tools: []
budgets:
  timeout_seconds: 300
  max_attempts: 1
  max_concurrency: 1
expected_artifact: review_findings
provenance:
  example: nightly-compatibility-guardian
  role: triager
