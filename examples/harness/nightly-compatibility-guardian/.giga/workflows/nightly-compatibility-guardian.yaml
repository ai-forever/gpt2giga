id: nightly-compatibility-guardian
title: Nightly Compatibility Guardian
description: Run the pinned matrix, then triage only retained regression evidence.
schema_version: 1
version: 1.0.0
inputs:
  prompt: Run the pinned nightly compatibility contract.
provenance:
  example: nightly-compatibility-guardian
  execution: on_demand_review
budgets:
  max_concurrency: 1
  max_steps: 3
  timeout_seconds: 3600
steps:
  - id: matrix
    kind: eval
    title: Run pinned adapter and model matrix
    eval_id: nightly-compatibility
    harness_ids: [codex-cli, claude-code, gemini-cli]
  - id: triage
    kind: agent
    title: Classify retained compatibility evidence
    agent_id: compatibility-triager
    depends_on: [matrix]
    condition: on_failure
    prompt: "Triage the retained compatibility evidence for: ${prompt}"
    artifact_types: [review_findings]
  - id: evidence
    kind: join
    title: Retain scorecard and triage lineage
    depends_on: [matrix, triage]
    condition: always
