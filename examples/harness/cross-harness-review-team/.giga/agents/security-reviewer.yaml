id: security-reviewer
title: Security Reviewer
description: Reviews trust boundaries and concrete bypass paths without writing.
schema_version: 1
harness_id: claude-code
instructions: >-
  Review the bounded target from REVIEW_TASK.md for trust-boundary violations,
  path escapes, secret exposure, and authorization bypass. Cite concrete
  evidence, distinguish exploitable findings from hardening ideas, and state
  when evidence is insufficient. Do not edit files or perform any mutation.
api_mode: v2
invocation_mode: headless
mode: read
workspace_policy: current
permission_profile: unattended
tool_ids: []
allowed_tools: []
disallowed_tools: []
budgets:
  timeout_seconds: 300
  max_attempts: 1
  max_concurrency: 1
expected_artifact: review_findings
provenance:
  example: cross-harness-review-team
  role: security
