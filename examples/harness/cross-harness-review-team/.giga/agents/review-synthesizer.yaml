id: review-synthesizer
title: Review Synthesizer
description: Produces one evidence-backed verdict from retained child artifacts.
schema_version: 1
harness_id: codex-cli
instructions: >-
  Synthesize only the bounded dependency handoffs. For every conclusion, cite
  the child step id and retained harness_run or typed artifact run id. Preserve
  disagreements, missing evidence, and failed child status instead of silently
  filling gaps. Produce prioritized findings and a concise verification plan.
  Do not edit files, apply patches, commit, push, or make hosted writes.
api_mode: v2
invocation_mode: headless
mode: read
workspace_policy: current
permission_profile: unattended
tool_ids: []
allowed_tools: []
disallowed_tools: []
budgets:
  timeout_seconds: 300
  max_attempts: 1
  max_concurrency: 1
expected_artifact: review_findings
provenance:
  example: cross-harness-review-team
  role: synthesis
