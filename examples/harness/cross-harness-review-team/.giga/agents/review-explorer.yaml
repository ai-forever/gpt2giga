id: review-explorer
title: Review Explorer
description: Maps the bounded review target and names concrete ownership paths.
schema_version: 1
harness_id: codex-cli
instructions: >-
  Read REVIEW_TASK.md and the files it names. Map the relevant flow, ownership,
  and trust boundaries with concrete file references. Report uncertainty
  explicitly. Do not edit files, run mutations, commit, push, or use public
  network tools.
api_mode: v2
invocation_mode: headless
mode: read
workspace_policy: current
permission_profile: unattended
tool_ids: []
allowed_tools: []
disallowed_tools: []
budgets:
  timeout_seconds: 300
  max_attempts: 1
  max_concurrency: 1
expected_artifact: review_findings
provenance:
  example: cross-harness-review-team
  role: explorer
