id: cross-harness-review-team
title: Cross-harness Review Team
description: Fan out four read-only reviews, then synthesize their retained evidence.
schema_version: 1
version: 1.0.0
inputs:
  prompt: Review the bounded task in REVIEW_TASK.md.
provenance:
  example: cross-harness-review-team
  execution: on_demand_review
budgets:
  max_concurrency: 4
  max_steps: 5
  timeout_seconds: 1800
steps:
  - id: explore
    kind: agent
    title: Map the review target
    agent_id: review-explorer
    prompt: "Explore the bounded review target: ${prompt}"
  - id: security
    kind: agent
    title: Review security boundaries
    agent_id: security-reviewer
    prompt: "Perform a security review for: ${prompt}"
  - id: tests
    kind: agent
    title: Review test evidence
    agent_id: test-reviewer
    prompt: "Review test coverage for: ${prompt}"
  - id: maintainability
    kind: agent
    title: Review maintainability
    agent_id: maintainability-reviewer
    prompt: "Review maintainability for: ${prompt}"
  - id: synthesize
    kind: agent
    title: Synthesize retained review evidence
    agent_id: review-synthesizer
    depends_on: [explore, security, tests, maintainability]
    condition: always
    prompt: "Synthesize the retained cross-harness evidence for: ${prompt}"
