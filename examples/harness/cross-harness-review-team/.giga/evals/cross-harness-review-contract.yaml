name: cross-harness-review-contract
description: Verify the packaged read-only fan-out and evidence-synthesis contract.
harnesses: [codex-cli]
api_mode: v2
mode: read
workspace_policy: current
metadata:
  example: cross-harness-review-team
  stage: contract_verification
  required_roles: [explore, security, tests, maintainability]
cases:
  - id: reviewed_team_contract
    prompt: >-
      Read REVIEW_TASK.md, the five profiles, and
      .giga/workflows/cross-harness-review-team.yaml. Return the marker
      CROSS_HARNESS_REVIEW_VERIFIED only if four read-only roles fan out with
      bounded concurrency, synthesis always runs after all four terminal child
      states, and synthesis requires citations to retained child artifacts.
      Do not edit files.
    required_capability: agent_cli
    checks:
      - name: verified_marker
        type: contains
        value: CROSS_HARNESS_REVIEW_VERIFIED
      - name: no_contract_failure
        type: not_contains_regex
        value: "(?i)(contract failed|shared writable workspace|missing evidence)"
