[project]
name = "gpt2giga-harness"
version = "0.4.1a1"
description = "Local agentic control plane for gpt2giga"
authors = [{ name = "Ruslan Yakupov", email = "rusyak1999@gmail.com" }]
requires-python = ">=3.10,<4,<3.15"
readme = "README.md"
license = "MIT"
dependencies = [
    "anyio>=4.10,<5",
    "fastapi>=0.133.0,<1",
    "pydantic>=2.12.0,<3",
    "pyyaml>=6.0,<7",
    "python-dateutil>=2.9.0,<3",
    "starlette>=1.1,<2",
    "textual>=8.2.8,<9",
    "tomli>=2.0,<3; python_version < '3.11'",
    "uvicorn>=0.41.0,<1",
]

[project.scripts]
gpt2giga-harness = "gpt2giga_harness.entrypoint:main"
giga = "gpt2giga_harness.entrypoint:main"
giga-skills-catalog-proxy = "gpt2giga_harness.skills_catalog_proxy:main"

[project.entry-points."gpt2giga.harnesses"]
direct-chat = "gpt2giga_harness.harnesses.direct_chat:DirectChatHarness"
codex-cli = "gpt2giga_harness.harnesses.codex_cli:CodexCliHarness"
claude-code = "gpt2giga_harness.harnesses.claude_code:ClaudeCodeHarness"
gemini-cli = "gpt2giga_harness.harnesses.gemini_cli:GeminiCliHarness"
echo = "gpt2giga_harness.harnesses.echo:EchoHarness"

[project.entry-points."agent_workbench.harness_adapters.v1"]
direct-chat = "gpt2giga_harness.harnesses.direct_chat:DirectChatHarness"
codex-cli = "gpt2giga_harness.harnesses.codex_cli:CodexCliHarness"
claude-code = "gpt2giga_harness.harnesses.claude_code:ClaudeCodeHarness"
gemini-cli = "gpt2giga_harness.harnesses.gemini_cli:GeminiCliHarness"
echo = "gpt2giga_harness.harnesses.echo:EchoHarness"

[project.entry-points."agent_workbench.provider_adapters.v1"]
direct-chat-legacy = "gpt2giga_harness.provider_profiles:direct_chat_legacy_compatibility"
codex-legacy = "gpt2giga_harness.provider_profiles:codex_legacy_compatibility"
claude-legacy = "gpt2giga_harness.provider_profiles:claude_legacy_compatibility"
gemini-legacy = "gpt2giga_harness.provider_profiles:gemini_legacy_compatibility"

[project.entry-points."agent_workbench.environment_providers.v1"]
git = "gpt2giga_harness.environments:git_environment_provider_plugin"

[project.optional-dependencies]
gpt2giga = [
    "gpt2giga==0.2.4a1",
    "gigachat>=0.2.2a1,<0.3.0",
]
claude-sdk = [
    "claude-agent-sdk>=0.2.122,<0.3",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/gpt2giga_harness/evidence/**",
    "src/gpt2giga_harness/integration_sdk_preview/**",
    "src/gpt2giga_harness/ui/assets/**",
    "src/gpt2giga_harness/ui/cockpit_v2/assets/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpt2giga_harness"]

[tool.hatch.build.targets.sdist]
exclude = ["/frontend"]

[tool.uv.sources]
gpt2giga = { workspace = true }
